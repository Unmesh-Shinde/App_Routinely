plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.dailyroutine.app'
    compileSdk 37

    defaultConfig {
        applicationId "com.dailyroutine.app"
        minSdk 26
        targetSdk 37
        versionCode 7
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // The app talks to the Worker over HTTPS. Keep only this non-secret URL in local.properties.
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localProperties.load(new FileInputStream(localPropertiesFile))
        }
        def aiBackendUrl = localProperties.getProperty('AI_BACKEND_URL') ?: System.getenv("AI_BACKEND_URL") ?: ""
        buildConfigField "String", "AI_BACKEND_URL", "\"${aiBackendUrl}\""
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    // Firebase platform versioning; individual Firebase libraries omit versions.
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.biometric:biometric:1.1.0'
    
    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Health Connect
    implementation 'androidx.health.connect:connect-client:1.1.0'

    // Google Fit (direct Heart Points)
    implementation 'com.google.android.gms:play-services-fitness:21.2.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    
    // OkHttp for calls to the private AI backend
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    
    // Coil image loading
    implementation 'io.coil-kt:coil:2.5.0'
    
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'

    // Room database for daily health metrics
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    kapt 'androidx.room:room-compiler:2.8.4'

    // Local unit tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.room:room-testing:2.8.4'
    testImplementation 'androidx.work:work-testing:2.9.0'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
}
